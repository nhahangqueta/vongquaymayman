<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quê Ta - Vòng Quay May Mắn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Alex+Brush&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg-flat:#4d601e;
    --bg-1:#586e22;
    --bg-2:#3c4a18;
    --gold-1:#f3d692;
    --gold-2:#d4a84a;
    --gold-3:#9a7328;
    --wood-1:#c99a5b;
    --wood-2:#8a5a2e;
    --wood-3:#3e2712;
    --win-dark:#16261a;
    --win-light:#31502f;
    --lose-dark:#665f20;
    --lose-light:#948d3a;
    --panel-bg:rgba(16,22,10,0.55);
    --panel-border:#c9a24a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0;
    background-color: var(--bg-flat);
    background-image: radial-gradient(ellipse at 50% 0%, var(--bg-1) 0%, var(--bg-flat) 65%, var(--bg-2) 100%);
    font-family:'Be Vietnam Pro', sans-serif;
    color:var(--gold-1);
    min-height:100vh;
    overflow-x:hidden;
  }
  .stage{
    max-width:1760px;
    margin:0 auto;
    padding:36px 40px 60px;
  }
  .icon-defs{ position:absolute; width:0; height:0; overflow:hidden; }

  /* ---------- Header ---------- */
  .header{ text-align:center; margin-bottom:8px; }
  .brand-logo{
    display:block; margin:0 auto; width:min(560px, 90%); height:auto;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,0.35));
  }
  .subtitle{
    font-family:'Cinzel', serif; font-size:29px; letter-spacing:2px;
    color:var(--gold-2); margin-top:10px; font-weight:600;
  }

  /* ---------- Layout ---------- */
  .content{
    display:flex; align-items:center; justify-content:center; gap:60px;
    margin-top:40px; flex-wrap:wrap;
  }
  .wheel-wrap{ position:relative; width:740px; max-width:92vw; flex-shrink:0; }
  .pointer{ position:absolute; top:-1%; left:50%; transform:translateX(-50%); width:16%; height:auto; z-index:5;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,0.5)); }
  .wheel-svg{ width:100%; height:auto; display:block; filter:drop-shadow(0 12px 26px rgba(0,0,0,0.5)); }
  .wheel-rotor{ transform-origin:200px 200px; transition:transform 4.2s cubic-bezier(.17,.67,.23,1); }
  .seg-label-serif{ font-family:'Be Vietnam Pro', sans-serif; font-weight:700; fill:var(--gold-1); }
  .seg-label-hint{ font-family:'Be Vietnam Pro', sans-serif; font-weight:600; fill:rgba(243,214,146,0.8); }

  /* ---------- Right panel ---------- */
  .panel-col{ display:flex; flex-direction:column; gap:22px; width:460px; max-width:94vw; }
  .panel{
    background:rgba(20,26,10,0.22); border:1px solid var(--panel-border); border-radius:8px;
    padding:16px 20px 18px; box-shadow:inset 0 0 0 1px rgba(212,168,74,0.1), 0 4px 14px rgba(0,0,0,0.25);
  }
  .panel-title{ font-family:'Cinzel', serif; font-size:15px; letter-spacing:3px; color:var(--gold-1);
    margin-bottom:12px; text-align:center; font-weight:600; }
  .input-row{ display:flex; gap:10px; }
  .name-input{
    flex:1; background:rgba(0,0,0,0.25); border:1px solid var(--gold-3); border-radius:6px;
    padding:12px 14px; color:var(--gold-1); font-family:'Be Vietnam Pro', sans-serif; font-size:14.5px; outline:none;
  }
  .name-input::placeholder{ color:rgba(243,214,146,0.4); }
  .name-input:focus{ border-color:var(--gold-1); box-shadow:0 0 0 2px rgba(243,214,146,0.18); }
  .btn-confirm{
    background:linear-gradient(180deg, #f0d68f, #c99a3c); border:1px solid var(--gold-1); color:#2b2308;
    font-weight:700; font-family:'Be Vietnam Pro', sans-serif; border-radius:6px; padding:0 20px; cursor:pointer;
    font-size:14px; letter-spacing:0.3px; transition:transform .15s ease, filter .15s ease; white-space:nowrap;
  }
  .btn-confirm:hover{ filter:brightness(1.08); transform:translateY(-1px); }
  .btn-confirm:active{ transform:translateY(0px) scale(0.98); }

  .name-list{ margin-top:14px; max-height:190px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:4px; }
  .name-list::-webkit-scrollbar{ width:6px; }
  .name-list::-webkit-scrollbar-thumb{ background:var(--gold-3); border-radius:4px; }
  .name-chip{
    display:flex; align-items:center; justify-content:space-between; background:rgba(0,0,0,0.2);
    border:1px solid rgba(212,168,74,0.35); border-radius:6px; padding:9px 12px; font-size:14.5px; color:var(--gold-1);
  }
  .name-chip .idx{ color:var(--gold-2); margin-right:8px; font-weight:600; }
  .name-chip .remove{ cursor:pointer; color:rgba(243,214,146,0.5); font-size:17px; line-height:1; padding:0 4px; }
  .name-chip .remove:hover{ color:#e88; }
  .empty-hint{ font-size:13px; color:rgba(243,214,146,0.4); text-align:center; padding:6px 0 2px; font-style:italic; }

  /* ---------- History panel ---------- */
  .panel-title-row{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; margin-bottom:12px; gap:10px; }
  .panel-title-row .panel-title{ margin-bottom:0; text-align:center; }
  .panel-title-spacer{ width:1px; }
  .btn-icon-only{ justify-self:end; padding:5px 9px; font-size:14px; line-height:1; }
  .btn-panel-action{
    background:none; border:1px solid rgba(212,168,74,0.4); color:rgba(243,214,146,0.8);
    font-family:'Be Vietnam Pro', sans-serif; font-size:12px; border-radius:5px; padding:5px 11px;
    cursor:pointer; letter-spacing:0.3px; white-space:nowrap; flex-shrink:0;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
    display:inline-flex; align-items:center; gap:5px;
  }
  .btn-panel-action:hover{ border-color:var(--gold-1); color:var(--gold-1); background:rgba(212,168,74,0.1); }
  .btn-panel-action:active{ transform:translateY(1px); }
  .history-list{ margin-top:0; max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:4px; }
  .history-list::-webkit-scrollbar{ width:6px; }
  .history-list::-webkit-scrollbar-thumb{ background:var(--gold-3); border-radius:4px; }
  .history-chip{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px 10px;
    background:rgba(0,0,0,0.2); border:1px solid rgba(212,168,74,0.35); border-radius:6px;
    padding:9px 12px; font-size:14.5px; color:var(--gold-1);
  }
  .history-chip .history-main{ display:flex; align-items:center; min-width:0; flex:1 1 auto; }
  .history-chip .idx{ color:var(--gold-2); margin-right:8px; font-weight:600; flex-shrink:0; }
  .history-chip .history-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .history-chip .history-time{ color:rgba(243,214,146,0.55); font-size:12px; flex-shrink:0; white-space:nowrap; margin-left:auto; }

  /* ---------- Spin plaque (centered) ---------- */
  .spin-btn-outer{ display:flex; justify-content:center; }
  .spin-btn-wrap{ position:relative; width:100%; max-width:340px; }
  .btn-spin{
    display:block; width:100%; background:none; border:none; padding:0; cursor:pointer;
    transition:transform .15s ease, filter .15s ease;
  }
  .btn-spin:hover{ transform:translateY(-2px); filter:brightness(1.05); }
  .btn-spin:active{ transform:translateY(0); }
  .btn-spin:disabled{ opacity:0.55; cursor:not-allowed; transform:none; filter:none; }
  .btn-spin svg{ width:100%; height:auto; display:block; overflow:visible; }
  .spin-label{ font-family:'Cinzel', serif; font-size:25px; font-weight:700; letter-spacing:3px; fill:var(--gold-1);
    text-shadow:0 2px 4px rgba(0,0,0,0.5); }

  .sparkle{ position:absolute; filter:drop-shadow(0 0 4px rgba(255,238,190,0.8)); pointer-events:none; }

  /* ---------- Result popup ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(8,12,4,0.66);
    display:flex; align-items:center; justify-content:center; z-index:1000;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
    padding:20px;
  }
  .modal-overlay.show{ opacity:1; pointer-events:auto; }
  .modal-card{
    position:relative; overflow:hidden; text-align:center;
    background:linear-gradient(160deg, #4a5c22, #1b2410);
    border:2px solid var(--panel-border); border-radius:18px;
    padding:38px 42px 32px; max-width:420px; width:100%;
    box-shadow:0 24px 60px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(212,168,74,0.2);
    transform:scale(0.82) translateY(10px); transition:transform .28s cubic-bezier(.17,.67,.23,1);
  }
  .modal-overlay.show .modal-card{ transform:scale(1) translateY(0); }
  .modal-card::before{
    content:""; position:absolute; inset:0;
    background-image:radial-gradient(circle, rgba(212,168,74,0.16) 1.5px, transparent 1.6px);
    background-size:22px 22px; opacity:0.6; pointer-events:none;
  }
  .modal-eyebrow{ position:relative; font-family:'Be Vietnam Pro', sans-serif; font-size:15px; letter-spacing:2px;
    font-weight:600; color:var(--gold-2); margin-bottom:14px; }
  .modal-won{ position:relative; font-family:'Be Vietnam Pro', sans-serif; font-size:16px; font-weight:600;
    letter-spacing:0.5px; color:#a9e08a; margin-bottom:24px; }
  .modal-name{ position:relative; font-family:'Cinzel', serif; font-size:32px; font-weight:700;
    color:var(--gold-1); text-shadow:0 0 16px rgba(169,224,138,0.35); word-break:break-word; margin-bottom:10px; }
  .modal-close{
    position:relative; background:linear-gradient(180deg, #f0d68f, #c99a3c); border:1px solid var(--gold-1);
    color:#2b2308; font-weight:600; font-family:'Be Vietnam Pro', sans-serif; border-radius:9px;
    padding:12px 32px; cursor:pointer; font-size:15px; letter-spacing:0.5px;
    transition:transform .15s ease, filter .15s ease;
  }
  .modal-close:hover{ filter:brightness(1.08); transform:translateY(-1px); }
  .modal-close:active{ transform:translateY(0) scale(0.98); }

  @media (max-width:900px){
    .stage{ padding:24px 16px 40px; }
    .subtitle{ font-size:19px; letter-spacing:1px; margin-top:8px; }
    .content{ gap:28px; margin-top:28px; }
    .wheel-wrap{ width:520px; }
    .panel-col{ width:460px; }
  }

  @media (max-width:640px){
    .stage{ padding:18px 12px 32px; }
    .header{ margin-bottom:4px; }
    .subtitle{ font-size:16px; letter-spacing:0.6px; }
    .content{ gap:20px; margin-top:20px; }
    .wheel-wrap{ width:100%; max-width:420px; }
    .panel-col{ width:100%; max-width:420px; gap:16px; }
    .panel{ padding:14px 16px 16px; }
    .panel-title{ font-size:13px; letter-spacing:2px; margin-bottom:10px; }
    .name-input{ font-size:14px; padding:11px 12px; }
    .btn-confirm{ font-size:13px; padding:0 16px; }
    .name-list{ max-height:150px; }
    .name-chip{ font-size:13.5px; padding:8px 10px; }
    .spin-label{ font-size:19px; letter-spacing:2px; }
    .modal-card{ padding:30px 26px 26px; }
    .modal-name{ font-size:26px; }
  }

  @media (max-width:420px){
    .subtitle{ font-size:13px; }
    .input-row{ flex-direction:column; }
    .btn-confirm{ padding:11px 0; }
    .spin-label{ font-size:16px; letter-spacing:1.5px; }
    .modal-card{ padding:26px 18px 20px; }
    .modal-name{ font-size:21px; }
    .modal-eyebrow{ font-size:13px; }
  }
</style>
</head>

<script>
(function(){
  const cx = 200, cy = 200, rOuter = 176;
  const svgNS = "http://www.w3.org/2000/svg";

  function polar(cx, cy, r, angleDeg){
    const a = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  }

  function describeSlice(startAngle, endAngle){
    const p1 = polar(cx, cy, rOuter, startAngle);
    const p2 = polar(cx, cy, rOuter, endAngle);
    const large = endAngle - startAngle > 180 ? 1 : 0;
    return `M ${cx} ${cy} L ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${rOuter} ${rOuter} 0 ${large} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} Z`;
  }

  const segGroup = document.getElementById("segments");
  const emptyStateLabel = document.getElementById("emptyStateLabel");

  function drawWheel(){
    segGroup.innerHTML = "";
    const count = names.length;

    if(count === 0){
      const path = document.createElementNS(svgNS,"path");
      path.setAttribute("d", describeSlice(0, 359.99));
      path.setAttribute("fill", "url(#segGradB)");
      path.setAttribute("stroke", "#e9c877");
      path.setAttribute("stroke-width","2");
      segGroup.appendChild(path);

      emptyStateLabel.style.display = "block";
      return;
    }

    emptyStateLabel.style.display = "none";

    const segAngle = 360 / count;
    // Radial label layout (reads from near the hub outward to the rim,
    // like classic prize-wheel labels): the text's LENGTH is bounded by the
    // radial band available (fixed, independent of how many names there
    // are), while its FONT SIZE is bounded by how angularly wide each slice
    // is (so tall letters don't spill into the neighboring slice).
    const innerRadius = rOuter * 0.45;
    const outerRadiusLimit = rOuter * 0.95;
    const maxTextLength = outerRadiusLimit - innerRadius;
    const avgCharWidth = 0.56;

    // A single name has the full circle to itself (no neighboring slice to
    // worry about), so give the font-size formula a generous reference
    // angle instead of the real (here, ~0) full-circle angle.
    const referenceAngleDeg = (count === 1) ? 46 : segAngle;
    const refRadius = (innerRadius + outerRadiusLimit) / 2;
    const chordWidth = 2 * refRadius * Math.sin((referenceAngleDeg * Math.PI/180)/2);
    // Linear map calibrated so the font visibly shrinks across the whole
    // practical range of names (a couple of people down to a couple dozen),
    // instead of sitting pinned at the max cap until slices get very thin.
    const fontMax = 18, fontMin = 7;
    const chordAtFew = 246.4;  // chordWidth around count = 2
    const chordAtMany = 30.9;  // chordWidth around count = 25
    const slope = (fontMax - fontMin) / (chordAtFew - chordAtMany);
    const intercept = fontMax - slope * chordAtFew;
    const fontSize = (count === 1)
      ? fontMax
      : Math.max(fontMin, Math.min(fontMax, chordWidth * slope + intercept));

    for(let i=0;i<count;i++){
      const start = i * segAngle;
      // A single name occupies the full 360° circle. Using exactly 360°
      // makes the arc's start/end points coincide, producing a degenerate
      // (invisible) SVG path, so we stop just short of a full turn — the
      // same trick already used for the empty-state placeholder slice.
      const end = (count === 1) ? start + 359.99 : start + segAngle;
      const mid = start + segAngle/2;

      const path = document.createElementNS(svgNS,"path");
      path.setAttribute("d", describeSlice(start,end));
      path.setAttribute("fill", i % 2 === 0 ? "url(#segGradA)" : "url(#segGradB)");
      path.setAttribute("stroke", "#e9c877");
      path.setAttribute("stroke-width","2");
      segGroup.appendChild(path);

      // Rotating the whole group by (mid - 90) makes the group's local
      // +x axis point radially outward at this slice's middle angle, so a
      // "text-anchor: start" label placed at x = innerRadius naturally
      // reads from near the center out toward the rim.
      const rotateDeg = mid - 90;
      const g = document.createElementNS(svgNS,"g");
      g.setAttribute("transform", `translate(${cx},${cy}) rotate(${rotateDeg.toFixed(3)})`);

      const name = names[i];
      let effectiveFontSize = fontSize;
      let naturalLength = name.length * effectiveFontSize * avgCharWidth;

      const t = document.createElementNS(svgNS,"text");
      t.setAttribute("x", outerRadiusLimit.toFixed(2));
      t.setAttribute("y","0");
      t.setAttribute("text-anchor","end");
      t.setAttribute("dominant-baseline","middle");
      t.setAttribute("class","seg-label-serif");
      t.setAttribute("font-size", effectiveFontSize.toFixed(1));
      t.setAttribute("letter-spacing","0.3");
      if(naturalLength > maxTextLength){
        t.setAttribute("textLength", maxTextLength.toFixed(2));
        t.setAttribute("lengthAdjust","spacingAndGlyphs");
      }
      t.textContent = name;
      g.appendChild(t);
      segGroup.appendChild(g);
    }
  }

  // rim bolts
  const bolts = document.getElementById("rimBolts");
  for(let i=0;i<16;i++){
    const p = polar(cx, cy, 190, i * (360/16));
    const c = document.createElementNS(svgNS,"circle");
    c.setAttribute("cx", p.x.toFixed(2));
    c.setAttribute("cy", p.y.toFixed(2));
    c.setAttribute("r", 3.8);
    c.setAttribute("fill", "#e9c877");
    c.setAttribute("stroke", "#4a2f16");
    c.setAttribute("stroke-width","1.2");
    bolts.appendChild(c);
    const hl = document.createElementNS(svgNS,"circle");
    hl.setAttribute("cx", (p.x-1).toFixed(2));
    hl.setAttribute("cy", (p.y-1).toFixed(2));
    hl.setAttribute("r", 1.2);
    hl.setAttribute("fill", "#fff3d0");
    hl.setAttribute("opacity","0.8");
    bolts.appendChild(hl);
  }

  // ---------- designated winners ----------
  // Tên trong danh sách này sẽ luôn được ưu tiên chọn khi quay (miễn là họ
  // vẫn còn trong vòng quay). Nếu không còn ai trong danh sách này, vòng
  // quay sẽ quay ngẫu nhiên như bình thường trong số các tên còn lại.
  // Việc so khớp KHÔNG còn phân biệt hoa/thường và bỏ qua khoảng trắng
  // thừa ở đầu/cuối cũng như khoảng trắng lặp ở giữa, để tên nhập vào ô
  // danh sách không cần phải khớp tuyệt đối 100% với tên trong danh sách
  // dưới đây (ví dụ "  Tên 1" hay "tên 1" vẫn được tính là trùng khớp).
  function normalizeName(str){
    return str.trim().replace(/\s+/g, " ").toLowerCase();
  }

  const designatedWinners = [
    "Tên 1", "Tên 2", "Tên 3", "Tên 4", "Tên 5",
    "Tên 6", "Tên 7", "Tên 8", "Tên 9", "Tên 10",
    "Tên 11", "Tên 12", "Tên 13", "Tên 14", "Tên 15",
    "Tên 16", "Tên 17", "Tên 18", "Tên 19", "Tên 20"
  ];
  const designatedSet = new Set(designatedWinners.map(normalizeName));

  // ---------- name queue (drives the wheel directly) ----------
  let names = [];
  const nameInput = document.getElementById("nameInput");
  const confirmBtn = document.getElementById("confirmBtn");
  const nameListEl = document.getElementById("nameList");
  const emptyHint = document.getElementById("emptyHint");
  const spinBtn = document.getElementById("spinBtn");

  function renderList(){
    nameListEl.innerHTML = "";
    emptyHint.style.display = names.length ? "none" : "block";
    names.forEach((n, i)=>{
      const chip = document.createElement("div");
      chip.className = "name-chip";
      chip.innerHTML = `<span><span class="idx">${i+1}.</span>${escapeHtml(n)}</span><span class="remove" data-i="${i}">✕</span>`;
      nameListEl.appendChild(chip);
    });
  }

  function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  function addName(){
    const val = nameInput.value.trim();
    if(!val) return;
    names.push(val);
    nameInput.value = "";
    renderList();
    drawWheel();
    nameInput.focus();
  }

  confirmBtn.addEventListener("click", addName);
  nameInput.addEventListener("keydown", (e)=>{ if(e.key === "Enter") addName(); });

  nameListEl.addEventListener("click", (e)=>{
    if(e.target.classList.contains("remove")){
      const i = parseInt(e.target.dataset.i, 10);
      names.splice(i,1);
      renderList();
      drawWheel();
    }
  });

  drawWheel();

  // ---------- spin history ----------
  let history = [];
  const historyListEl = document.getElementById("historyList");
  const emptyHistoryHint = document.getElementById("emptyHistoryHint");

  function renderHistory(){
    historyListEl.innerHTML = "";
    emptyHistoryHint.style.display = history.length ? "none" : "block";
    // Lượt quay gần nhất hiển thị lên đầu danh sách.
    history.slice().reverse().forEach((entry)=>{
      const chip = document.createElement("div");
      chip.className = "history-chip";
      chip.innerHTML = `<span class="history-main"><span class="history-name">${escapeHtml(entry.name)}</span></span><span class="history-time">${escapeHtml(entry.time)}</span>`;
      historyListEl.appendChild(chip);
    });
  }

  function addHistoryEntry(name){
    const now = new Date();
    const date = now.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric" });
    const time = now.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    history.push({ name, time: `${date} ${time}` });
    renderHistory();
  }

  renderHistory();

  // ---------- export history to Excel ----------
  const exportHistoryBtn = document.getElementById("exportHistoryBtn");
  exportHistoryBtn.addEventListener("click", ()=>{
    if(history.length === 0){
      alert("Chưa có lượt quay nào để xuất.");
      return;
    }
    const rows = history.map((entry, i)=>({
      "STT": i + 1,
      "Tên trúng thưởng": entry.name,
      "Thời gian quay": entry.time
    }));
    const worksheet = XLSX.utils.json_to_sheet(rows);
    worksheet["!cols"] = [{ wch: 6 }, { wch: 32 }, { wch: 22 }];
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Lich su trung thuong");
    const now = new Date();
    const stamp = now.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric" }).replace(/\//g, "-");
    XLSX.writeFile(workbook, `Lich_su_trung_thuong_${stamp}.xlsx`);
  });

  // ---------- result popup ----------
  const resultOverlay = document.getElementById("resultOverlay");
  const modalName = document.getElementById("modalName");
  const modalCloseBtn = document.getElementById("modalCloseBtn");

  function showResult(name){
    modalName.textContent = name;
    resultOverlay.classList.add("show");
  }
  function hideResult(){
    resultOverlay.classList.remove("show");
    // Chỉ xóa tên khỏi vòng quay và vẽ lại vòng quay SAU KHI người dùng
    // đã đóng popup kết quả, để vòng quay không tự thay đổi ngay khi vừa
    // dừng lại trong lúc popup còn đang hiển thị.
    if(pendingWinnerIndex !== null){
      names.splice(pendingWinnerIndex, 1);
      renderList();
      currentRotation = currentRotation % 360;
      rotor.style.transition = "none";
      rotor.style.transform = `rotate(${currentRotation}deg)`;
      drawWheel();
      requestAnimationFrame(()=>{
        rotor.style.transition = "";
      });
      pendingWinnerIndex = null;
    }
  }
  modalCloseBtn.addEventListener("click", hideResult);
  resultOverlay.addEventListener("click", (e)=>{
    if(e.target === resultOverlay) hideResult();
  });

  // ---------- spin logic ----------
  let currentRotation = 0;
  let spinning = false;
  let pendingWinnerIndex = null;
  const rotor = document.getElementById("wheelRotor");

  spinBtn.addEventListener("click", ()=>{
    if(spinning) return;
    if(names.length === 0){
      nameInput.focus();
      nameInput.style.borderColor = "#c86a6a";
      setTimeout(()=>{ nameInput.style.borderColor = ""; }, 800);
      return;
    }
    spinning = true;
    spinBtn.disabled = true;

    const count = names.length;
    const segAngle = 360 / count;

    // Nếu còn ai trong danh sách "được chỉ định trúng thưởng" đang có mặt
    // trong vòng quay, chỉ chọn ngẫu nhiên trong số họ. Nếu không còn ai
    // thuộc danh sách đó nữa, quay ngẫu nhiên bình thường trong tất cả tên.
    const eligibleIndices = [];
    names.forEach((n, i)=>{ if(designatedSet.has(normalizeName(n))) eligibleIndices.push(i); });
    const pickPool = eligibleIndices.length > 0 ? eligibleIndices : names.map((_, i)=>i);
    const winnerIndex = pickPool[Math.floor(Math.random() * pickPool.length)];
    const winnerName = names[winnerIndex];

    // Chọn một điểm dừng ngẫu nhiên trong phạm vi lát cắt (không phải luôn
    // luôn chính giữa) để trông tự nhiên hơn, nhưng vẫn chừa một khoảng
    // đệm an toàn ở hai bên mép để mũi tên không vô tình chỉ sang tên khác.
    const edgeMargin = Math.min(segAngle * 0.32, 10);
    const randomOffset = edgeMargin + Math.random() * (segAngle - edgeMargin*2);
    const segCenter = winnerIndex * segAngle + randomOffset;
    const extraSpins = 5 + Math.floor(Math.random()*3);
    const targetMod = (360 - segCenter) % 360;
    const currentMod = ((currentRotation % 360) + 360) % 360;
    let delta = targetMod - currentMod;
    if(delta < 0) delta += 360;
    const finalRotation = currentRotation + extraSpins*360 + delta;

    currentRotation = finalRotation;
    rotor.style.transform = `rotate(${finalRotation}deg)`;

    setTimeout(()=>{
      spinning = false;
      spinBtn.disabled = false;

      addHistoryEntry(winnerName);
      pendingWinnerIndex = winnerIndex;
      showResult(winnerName);
    }, 4300);
  });
})();
</script>
</body>
</html>
